<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - EduManage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            /* Chemin mis à jour vers votre dossier de ressources src */
            background-image: url("src/images/image1.jpeg");
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-box shadow">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary"><i class="fa-solid fa-graduation-cap"></i> EduManage</h3>
            <p class="text-muted">Connexion à l'application</p>
        </div>

        
        <form action="index.php?action=traiter_connexion" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Identifiant</label>
                <input type="text" name="login" class="form-control" required placeholder="Votre login">
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Mot de passe</label>
                <input type="password" name="password" class="form-control" required placeholder="Votre mot de passe">
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Se connecter
            </button>
        </form>
    </div>

</body>
</html>
